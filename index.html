<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFD23F">
<title>Know Your City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://js.arcgis.com/4.33/esri/themes/light/main.css">
<style>
:root{
  --ink:#1E1B4B; --paper:#fff; --us:rgba(30,27,75,.5); --track:rgba(30,27,75,.14);
  --f-display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --bg:#FFD23F; --acc:#1E1B4B; --roof:#FFD23F;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#FFD23F;color:var(--ink);font:400 18px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

/* progress + header */
#progress{position:fixed;left:0;top:0;right:0;height:5px;background:var(--ink);transform-origin:0 50%;transform:scaleX(0);z-index:90}
.top{position:fixed;left:0;right:0;top:5px;z-index:110;display:flex;gap:12px;align-items:center;padding:10px clamp(14px,3vw,36px);pointer-events:none}
.top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:8px;font:800 22px var(--f-display);text-decoration:none;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:4px 12px 4px 8px}
.brand svg{width:26px;height:26px;fill:var(--ink)}
.search{position:relative;flex:1;max-width:460px;margin-left:auto}
.search input{width:100%;padding:11px 18px;border-radius:999px;border:3px solid var(--ink);background:#fff;font:700 16px var(--f-body);color:var(--ink)}
.search input::placeholder{color:rgba(30,27,75,.6)}
#sugg{position:absolute;left:0;right:0;top:calc(100% + 8px);margin:0;padding:6px;list-style:none;background:#fff;border-radius:18px;border:3px solid var(--ink);display:none}
#sugg li{padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:700}
#sugg li:hover{background:#FFE98F}
.pill{border:3px solid var(--ink);background:#fff;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer}
.pill:hover{background:#FFE98F}

/* scenes */
.scene{position:relative;background:var(--bg);padding:clamp(70px,9vh,110px) clamp(18px,6vw,90px) clamp(40px,7vh,90px)}
.sign{display:inline-block;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:6px 16px;font:800 20px var(--f-display);transform:rotate(-2deg);margin-bottom:2vh}
.beat{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,5vw,80px);align-items:center;min-height:82vh;max-width:1180px;margin:0 auto}
.beat.flip .txt{order:2}
.txt .main{font:800 clamp(30px,4.6vw,60px)/1.04 var(--f-display);letter-spacing:-.025em;margin:0 0 .5em;text-wrap:balance}
.txt .cmp{font-size:clamp(18px,1.7vw,22px);max-width:40ch;margin:0}
.twist .txt .main{font-size:clamp(34px,5.6vw,76px)}
.viz{position:relative;justify-self:center;width:100%;max-width:560px;border-radius:26px;padding:10px}
.viz.spot{outline:4px dashed var(--ink);outline-offset:8px}

/* hero */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:4vw;align-items:center;min-height:100vh;padding:110px clamp(18px,6vw,90px) 60px;background:#FFD23F}
.hero h1{font:800 clamp(56px,11vw,168px)/.88 var(--f-display);letter-spacing:-.045em;margin:0;word-break:break-word}
.hero .state{font:700 clamp(20px,2.2vw,30px) var(--f-display);margin:.4em 0 1em}
.hero .line{font-size:clamp(20px,2vw,26px);max-width:30ch;margin:0 0 1.4em}
.hero .cue{font-weight:700;margin:0;display:flex;align-items:center;gap:10px}
.hero .cue i{width:14px;height:14px;border-right:4px solid var(--ink);border-bottom:4px solid var(--ink);transform:rotate(45deg);animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{translate:0 0}50%{translate:0 8px}}
.house-map{position:relative;width:min(100%,560px);aspect-ratio:1/1.08;justify-self:center;background:var(--ink);clip-path:polygon(50% 0,100% 27%,100% 100%,0 100%,0 27%)}
.house-map .inner{position:absolute;inset:12px;background:#d9e4d0;clip-path:polygon(50% 0,100% 27%,100% 100%,0 100%,0 27%)}
#viewDiv{position:absolute;inset:0}
.maphint{position:absolute;left:12%;right:12%;bottom:5%;z-index:5;text-align:center;font-weight:700;font-size:14px;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:5px 12px;pointer-events:none;transition:opacity .4s}
.maphint.gone{opacity:0}
.esri-ui .esri-zoom{margin:14px 0 0 14px}

/* loading */
#loading{position:fixed;inset:0;z-index:100;background:#FFD23F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;font:800 clamp(22px,3vw,34px) var(--f-display);text-align:center;padding:20px;transition:opacity .5s}
#loading.gone{opacity:0;pointer-events:none}
#loading svg{width:90px;height:90px;fill:#fff;stroke:var(--ink);stroke-width:2.2;stroke-linejoin:round;animation:hopL 1s ease-in-out infinite}
@keyframes hopL{0%,100%{transform:translateY(0)}45%{transform:translateY(-22px)}}

/* crowd: 100 people */
.crowd{display:flex;gap:clamp(16px,3vw,40px);justify-content:center;flex-wrap:wrap}
.cg{display:grid;gap:8px;justify-items:start}
.cg .lab{font-weight:700;font-size:16px}
.cg .lab b{font:800 20px var(--f-display);margin-right:6px}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:clamp(3px,.5vw,6px);width:clamp(140px,21vw,240px)}
.dots i{position:relative;display:block;aspect-ratio:1/1.55;--c:var(--track)}
.dots i::before{content:"";position:absolute;left:27%;width:46%;top:0;aspect-ratio:1;border-radius:50%;background:var(--c)}
.dots i::after{content:"";position:absolute;left:10%;right:10%;top:44%;bottom:0;border-radius:45% 45% 20% 20%;background:var(--c)}
.cg.here .dots i.on{--c:var(--acc)}
.cg.us .dots i.on{--c:var(--us)}
.dots i.on{opacity:0}
.in .dots i.on{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*14ms)}
@keyframes pop{from{transform:scale(.1);opacity:0}to{transform:none;opacity:1}}

/* houses */
.hrows{display:grid;gap:22px}
.hrow .lab{font-weight:700;font-size:16px;margin-bottom:6px}
.hrow .lab b{font:800 20px var(--f-display);margin-right:6px}
.hs{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.hs1{position:relative;aspect-ratio:1;display:block}
.hs1 svg{position:absolute;inset:0;width:100%;height:100%}
.hs1 .bg{fill:var(--track)}
.hs1 .fg{fill:var(--acc);clip-path:inset(0 100% 0 0);transition:clip-path .8s cubic-bezier(.3,.8,.3,1);transition-delay:calc(var(--i)*70ms)}
.hrow.us .hs1 .fg{fill:var(--us)}
.in .hs1 .fg{clip-path:inset(0 calc(100% - var(--ff)*100%) 0 0)}

/* towers: dollar amounts as buildings */
.tower{display:flex;align-items:flex-end;justify-content:center;gap:clamp(22px,6vw,70px);height:340px}
.tcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;width:clamp(96px,16vw,150px)}
.tcol .v{font:800 clamp(22px,2.6vw,32px) var(--f-display);margin-bottom:6px;white-space:nowrap}
.tcol .b{width:100%;height:0;border-radius:12px 12px 0 0;background-color:var(--acc);background-image:repeating-linear-gradient(0deg,transparent 0 16px,rgba(255,255,255,.28) 16px 24px);transition:height 1.1s cubic-bezier(.2,.8,.2,1)}
.tcol.us .b{background-color:var(--us)}
.in .tcol .b{height:var(--h)}
.tcol .n{font-weight:700;margin-top:8px;font-size:16px}
.tower{border-bottom:5px solid var(--ink)}

/* rulers */
.ruler{position:relative;height:190px;margin:0 14px}
.ruler .line{position:absolute;left:0;right:0;top:92px;height:14px;border-radius:99px;background:var(--track)}
.ruler .fill{position:absolute;left:0;top:92px;height:14px;border-radius:99px;background:var(--acc);width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.in .ruler .fill{width:var(--w)}
.pin{position:absolute;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;text-align:center;font-weight:700;font-size:15px;line-height:1.15;height:106px;justify-content:flex-start}
.pin .lbl{display:block;white-space:nowrap;transform:translateX(var(--sh,0px))}
.pin b{display:block;font:800 clamp(20px,2.3vw,28px) var(--f-display)}
.pin i{display:block;width:22px;height:22px;border-radius:50%;border:4px solid var(--ink);background:var(--acc)}
.pin.top{top:0}.pin.top i{margin-top:6px}
.pin.bot{bottom:0;flex-direction:column-reverse}.pin.bot i{margin-bottom:6px}
.pin.us i{background:#fff}
.pin.st i{background:var(--ink);border-color:#fff;border-radius:6px;transform:rotate(45deg)}

/* rings */
.ringwrap{display:grid;justify-items:center;gap:8px}
.ring{position:relative;width:clamp(150px,18vw,200px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--track);stroke-width:14}
.ring .ar{fill:none;stroke:var(--acc);stroke-width:14;stroke-linecap:butt;stroke-dasharray:0 100;transition:stroke-dasharray 1.2s cubic-bezier(.2,.8,.2,1)}
.in .ring .ar{stroke-dasharray:var(--p) 100}
.ring .tk{stroke:var(--ink);stroke-width:3}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;font:800 clamp(28px,3.4vw,40px) var(--f-display)}
.ring-cap{font-size:15px;font-weight:700;text-align:center}

/* blocks: ratio as two stacks of houses */
.blocks{display:grid;gap:26px}
.brow .lab{font:800 20px var(--f-display);margin-bottom:8px}
.bh{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px}
.bh svg{width:clamp(34px,5vw,54px);height:clamp(34px,5vw,54px);transform:scale(0);transform-origin:50% 100%}
.in .bh svg{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*140ms)}
.bh .A{fill:var(--acc)}
.bh .B{fill:#fff;stroke:var(--ink);stroke-width:3}
.brow.us .bh .A{fill:var(--us)}
.key{font-size:15px;font-weight:700;display:flex;gap:16px;flex-wrap:wrap;margin-top:6px}
.key span::before{content:"";display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:6px;vertical-align:-2px;background:var(--acc);border:3px solid var(--ink)}
.key span.b::before{background:#fff}

/* owners ring grid */
.ringgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(24px,4vw,60px) clamp(16px,3vw,40px);max-width:1000px;margin:0 auto}
.ringcell{display:grid;gap:12px;justify-items:center;text-align:center}
.ringcell .main{font:800 clamp(20px,2.2vw,28px)/1.1 var(--f-display);margin:0;letter-spacing:-.015em}
.ringcell .cmp{font-size:16px;margin:4px 0 0;max-width:34ch}
.sub-intro{max-width:1000px;margin:0 auto 4vh}

/* composites: road + stairs */
.composite{max-width:1000px;margin:0 auto;padding:6vh 0}
.composite h3{font:800 clamp(28px,4vw,52px)/1.05 var(--f-display);letter-spacing:-.025em;margin:0 0 .6em;max-width:20ch}
.road{display:flex;height:70px;border-radius:14px;overflow:hidden;border:4px solid var(--ink);background:#fff;margin-bottom:26px}
.road span{display:grid;place-items:center;font-size:26px;min-width:0;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1);background:var(--acc);border-right:4px dashed #fff}
.road span:nth-child(2){background:var(--ink)}
.road span:nth-child(3){background:var(--us)}
.road span:nth-child(4){background:#fff}
.road span:last-child{border-right:0}
.in .road span{width:var(--w)}
.rrows{display:grid;gap:18px}
.rrow{display:grid;grid-template-columns:48px 1fr;gap:14px;align-items:start;padding:8px;border-radius:16px}
.rrow .em{font-size:34px;line-height:1}
.rrow .main{font:800 clamp(20px,2.3vw,28px)/1.1 var(--f-display);margin:0 0 4px;letter-spacing:-.015em}
.rrow .cmp{margin:0;font-size:16px;max-width:60ch}
.stairs{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(12px,3vw,36px);align-items:end}
.step{display:grid;gap:12px;align-content:end;padding:8px;border-radius:16px}
.step .col{position:relative;height:clamp(200px,32vh,300px);background:var(--track);border-radius:12px 12px 0 0;overflow:hidden}
.step .col .f{position:absolute;left:0;right:0;bottom:0;height:0;background:var(--acc);transition:height 1.1s cubic-bezier(.2,.8,.2,1)}
.in .step .col .f{height:var(--h)}
.step .col .u{position:absolute;left:0;right:0;height:0;border-top:4px dashed var(--ink);bottom:var(--u)}
.step .col .pc{position:absolute;left:10px;top:8px;font:800 clamp(22px,2.6vw,34px) var(--f-display)}
.step .main{font:800 clamp(18px,1.9vw,24px)/1.1 var(--f-display);margin:0;letter-spacing:-.015em}
.step .cmp{font-size:15px;margin:0}
.legend{font-size:15px;font-weight:700;margin-top:16px}
.legend::before{content:"";display:inline-block;width:34px;border-top:4px dashed var(--ink);vertical-align:middle;margin-right:8px}

/* postcards */
.cards{display:flex;flex-wrap:wrap;gap:clamp(18px,3vw,40px);justify-content:center;max-width:1100px;margin:0 auto;padding:4vh 0}
.pc{background:#fff;border:3px solid var(--ink);padding:14px 14px 20px;width:min(320px,100%);box-shadow:8px 8px 0 var(--ink)}
.pc:nth-child(odd){transform:rotate(-2.2deg)}
.pc:nth-child(even){transform:rotate(1.8deg);margin-top:26px}
.pc img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;margin-bottom:12px;border:3px solid var(--ink)}
.pc p{margin:0;font:500 clamp(18px,1.7vw,21px)/1.25 var(--f-display)}
.pc.spot{outline:4px dashed var(--ink);outline-offset:8px}
.pc.photo p{font-size:clamp(16px,1.5vw,19px)}
.pc .credit{margin-top:10px;font:400 12px/1.3 var(--f-body);opacity:.85;overflow-wrap:anywhere}
.pc .credit a{text-decoration:underline}
.cards-title{font:800 clamp(34px,5vw,64px)/1 var(--f-display);letter-spacing:-.03em;margin:0 auto;max-width:1100px}

/* next stop */
.end{text-align:left;max-width:1000px;margin:0 auto;padding:8vh 0 4vh}
.end h2{font:800 clamp(40px,7vw,100px)/.92 var(--f-display);letter-spacing:-.04em;margin:0 0 .4em}
.end .big{width:100%;max-width:560px;padding:16px 22px;border-radius:999px;border:4px solid var(--ink);font:700 20px var(--f-body);background:#fff;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.foot{max-width:1000px;margin:6vh auto 0;font-size:15px}
.foot p{margin:0 0 .8em;max-width:75ch}
.err{max-width:760px;margin:20vh auto;background:#fff;border:4px solid var(--ink);border-radius:22px;padding:26px}
.err h2{font:800 32px var(--f-display);margin:0 0 8px}



/* bars */
.bars{max-width:1000px;margin:0 auto;padding:6vh 0}
.bars h3{font:800 clamp(28px,4vw,52px)/1.05 var(--f-display);letter-spacing:-.025em;margin:0 0 1em;max-width:22ch}
.bar-rows{display:grid;gap:44px}
.brow2{padding:8px;border-radius:16px}
.brow2 .main{font:800 clamp(20px,2.4vw,30px)/1.12 var(--f-display);margin:0 0 12px;letter-spacing:-.015em;max-width:34ch}
.brow2 .lab{font-weight:700;font-size:15px;margin-bottom:6px}
.brow2 .cmp{margin:12px 0 0;font-size:16px;max-width:62ch}
.bar{position:relative;height:50px;border-radius:12px;background:var(--track)}
.bar .f{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:12px;background:var(--acc);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.in .bar .f{width:var(--w)}
.bar .f b{position:absolute;right:14px;top:50%;translate:0 -50%;color:#fff;font:800 22px var(--f-display);white-space:nowrap}
.bar .f.sh b{right:auto;left:calc(100% + 10px);color:var(--ink)}
.bar .t{position:absolute;top:-9px;bottom:-9px;width:0;border-left:5px solid var(--ink);z-index:2}
.bar .t.st{border-left:5px dotted #fff}
.legend2{font-size:15px;font-weight:700;margin:22px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.legend2 .k{display:inline-block;height:20px;border-left:5px solid var(--ink)}
.legend2 .k.st{border-left:5px dotted var(--ink);margin-left:14px}
/* duel */
.viz.vz-duel{max-width:640px}
.duelbox{display:grid;gap:22px}
.dgrp .dnum{font:800 clamp(44px,6.5vw,84px)/.95 var(--f-display);letter-spacing:-.04em}
.dgrp .dlab{font-weight:700;font-size:16px;margin:2px 0 8px;max-width:38ch}
.dh{display:flex;flex-wrap:wrap;gap:4px}
.dh .hs1{width:clamp(24px,3.3vw,36px);flex:none}
.dh.m .hs1 .fg{fill:#fff;stroke:var(--ink);stroke-width:2.5}
.dh.w .hs1 .fg{fill:var(--acc)}
.dunit{font-size:14px;font-weight:700;margin:-8px 0 0;opacity:.8}
.norm{position:relative;--lw:92px;--bw:calc(100% - var(--lw));background:rgba(255,255,255,.55);border-radius:18px;padding:16px;display:grid;gap:10px}
.norm .nt{margin:0 0 4px;font-weight:700;font-size:16px}
.nr{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.nr .nl{font-weight:700;font-size:15px;min-width:76px}
.nb{position:relative;height:34px;border-radius:9px;background:var(--track)}
.nf{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:9px;background:var(--acc);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.nr.us .nf{background:var(--us)}
.nr.st .nf{background:#fff;border:3px solid var(--ink)}
.in .nf{width:var(--w)}
.nf b{position:absolute;right:10px;top:50%;translate:0 -50%;color:#fff;font:800 18px var(--f-display)}
.nr.st .nf b{color:var(--ink)}
.norm .refline{display:none}


/* cap and gown: stacked degrees */
.stackb .stack{display:grid;gap:14px;margin-bottom:18px}
.srow{display:grid;grid-template-columns:minmax(70px,120px) 1fr 52px;gap:12px;align-items:center}
.srow .sn{font-weight:700;font-size:16px}
.srow .stot{font:800 22px var(--f-display)}
.sbar{display:flex;height:54px;border-radius:12px;background:var(--track);overflow:hidden}
.sg{display:grid;place-items:center;width:0;transition:width 1.1s cubic-bezier(.2,.8,.2,1);color:#fff;min-width:0}
.in .sg{width:var(--w)}
.sg b{font:800 17px var(--f-display);white-space:nowrap}
.s0{background-image:repeating-linear-gradient(135deg,var(--acc) 0 6px,rgba(255,255,255,.35) 6px 12px);background-color:var(--acc)}
.s1{background:var(--acc)}
.s2{background:var(--ink)}
.sg.s0 b{background:var(--acc);border-radius:6px;padding:0 5px}
.srow.us .sg{filter:grayscale(.85) opacity(.8)}
.skey{display:flex;gap:18px;flex-wrap:wrap;font-weight:700;font-size:15px;margin-bottom:34px}
.skey span{display:inline-flex;align-items:center;gap:8px}
.sw{display:inline-block;width:20px;height:20px;border-radius:5px;border:3px solid var(--ink);flex:none}
i.sw{border-width:3px}
.sw.s0{background-image:repeating-linear-gradient(135deg,var(--acc) 0 4px,#fff 4px 8px)}
.srows2{display:grid;gap:26px}
.srow2{display:grid;grid-template-columns:24px 1fr;gap:14px;align-items:start;padding:8px;border-radius:16px}
.srow2 .sw{margin-top:8px}
.srow2 .main{font:800 clamp(20px,2.3vw,28px)/1.12 var(--f-display);margin:0 0 4px;letter-spacing:-.015em}
.srow2 .cmp{margin:0;font-size:16px;max-width:62ch}
@media (max-width:820px){.srow{grid-template-columns:70px 1fr 44px;gap:8px}.sg b{font-size:14px}}

/* state comparison */
.cg.st .dots i.on{--c:#fff}
.crowd.three .dots{width:clamp(96px,14vw,160px)}
.hrow.st .hs1 .fg{fill:#fff}
.tcol.st .b{background-color:#fff;background-image:repeating-linear-gradient(0deg,transparent 0 16px,rgba(30,27,75,.16) 16px 24px)}
.tower.three{gap:clamp(12px,3vw,40px)}
.tower.three .tcol{width:clamp(78px,12vw,128px)}
.tower.three .tcol .v{font-size:clamp(16px,1.9vw,24px)}
.ring .tk2{stroke:var(--ink);stroke-width:3;stroke-dasharray:3 2}
.brow.st .bh .A{fill:#fff;stroke:var(--ink);stroke-width:3;stroke-dasharray:4 3}
.step .col .u2{position:absolute;left:0;right:0;height:0;border-top:4px dotted #fff;bottom:var(--u2)}
.pill[disabled]{opacity:.6;cursor:progress}
@media (max-width:820px){.pill{padding:7px 10px;font-size:14px}.top{gap:6px}}

/* Homie */
#homie{position:fixed;bottom:14px;left:14px;width:128px;z-index:70;transition:left .9s cubic-bezier(.5,0,.2,1);pointer-events:none}
#homie.off,#ptr.off{display:none}
#hsvg{display:block;width:100%;height:auto;cursor:pointer;pointer-events:auto;overflow:visible;filter:drop-shadow(0 6px 0 rgba(30,27,75,.18));animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
#homie.flip #hsvg{transform:scaleX(-1)}
#homie.hop #hsvg{animation:hop .8s ease-out}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -5px}}
@keyframes hop{0%{translate:0 0;scale:1 1}25%{translate:0 0;scale:1.1 .88}55%{translate:0 -28px;scale:.96 1.08}80%{translate:0 0;scale:1.08 .92}100%{translate:0 0;scale:1 1}}
.eyes{animation:blink 5s infinite;transform-origin:70px 96px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#hbub{position:absolute;bottom:calc(100% + 6px);left:0;width:min(340px,calc(100vw - 28px));background:#fff;border:3px solid var(--ink);border-radius:20px 20px 20px 4px;padding:12px 16px;font:700 clamp(17px,1.6vw,20px)/1.2 var(--f-display);box-shadow:5px 5px 0 var(--ink);pointer-events:none;opacity:0;transform:translateY(8px) scale(.95);transform-origin:0 100%;transition:opacity .25s,transform .25s}
#hbub.show{opacity:1;transform:none}
#homie.right #hbub{left:auto;right:0;border-radius:20px 20px 4px 20px;transform-origin:100% 100%}
#ptr{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:65}
#pp{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-dasharray:1 12;animation:march 1s linear infinite}
@keyframes march{to{stroke-dashoffset:-13}}
#ah{fill:var(--ink)}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding-top:100px}
  .house-map{width:min(86%,420px)}
  .beat{grid-template-columns:1fr;min-height:auto;padding:5vh 0;gap:3vh}
  .beat.flip .txt{order:0}
  .brand span{display:none}
  .ringgrid{grid-template-columns:1fr}
  .stairs{gap:8px}
  .tower{height:280px}
  #homie{width:84px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .dots i.on{opacity:1}
}
</style>

<!-- Homie: a friendly little house. An original character; swap the SVG for your own anytime. -->

      <circle cx="56" cy="93.5" r="2.2" fill="#fff"/><circle cx="88" cy="93.5" r="2.2" fill="#fff"/>
    </g>
    <circle cx="44" cy="110" r="5" fill="#FF9FB8" opacity=".85"/><circle cx="96" cy="110" r="5" fill="#FF9FB8" opacity=".85"/>
    <path d="M58 112q12 12 24 0" stroke="#1E1B4B" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M52 134v14M88 134v14M44 150h16M80 150h16" stroke="#1E1B4B" stroke-width="6" stroke-linecap="round"/>
    <path d="M30 104q-14 6-16 22" stroke="#1E1B4B" stroke-width="5" fill="none" stroke-linecap="round"/>

<script src="engine.js"></script>
<script src="https://js.arcgis.com/4.33/"></script>
<script>
/* ---------- Configuration ---------- */
// Keys can live here for a public deployment. ArcGIS key is optional (OpenStreetMap basemap + free geocoder without it).
// Optional: an ArcGIS web map for the hero. Its Census Places layer gets filtered to the selected place.
//   id:         the web map's item ID (share the map publicly), or "" to use a plain basemap
//   layerTitles: titles of the Census place layers in that web map ([] = every feature layer). Each gets the same filter.
//   expression: definition query; {GEOID} {STATE} {PLACE} {NAME} are replaced for each place
var WEBMAP = { id: "b8cf1cda3b8a478386ac03a1c0a3adcb", layerTitles: ["Census Designated Place", "Incorporated Place", "Consolidated City"], expression: "GEOID = '{GEOID}'" };
var HARDCODED = { census: "062d2715fc817fbaa69d6777a88b711f932144d1", arcgis: "AAPTaWduh3eXELl158kRP-_vyBA..8xaoKh-46KJCfHz90o-Y0aI17Tb8I8IBhRjko8G_mA7-7DjCsmDgISPtuoYHpsgVTDGecyPH7BOZKoeEGuX6BnkztKkBovzzu-pSkuhDP6DmrR1TbSnlyUtLsP8_sQef1QvN9CPAVxBYL5bseqICAS3cOq5GBGhje56t5nIEd7dQ73Q-BZcaCFYNqz_uS697ncoJ9Pxpla0hPLPxZYBZikghB3i7z6PrxFS039_jKFabqwF974_DXrQ.AT1_lxq1zj7D" };

(function () {
  var K = window.KYC;
  var qs = new URLSearchParams(location.search);
  var CFG = {
    CENSUS_KEY: HARDCODED.census || qs.get("census") || safeGet("kyc_census"),
    ARCGIS_KEY: HARDCODED.arcgis || qs.get("arcgis") || safeGet("kyc_arcgis"),
    VINTAGE: 2024,
    DEFAULT_GEOID: "0659962"   // Redlands, CA
  };
  var API = "https://api.census.gov/data/" + CFG.VINTAGE + "/acs/acs5/profile";
  var SUBJECT = "https://api.census.gov/data/" + CFG.VINTAGE + "/acs/acs5/subject";
  var TIGER = "https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/Places_CouSub_ConCity_SubMCD/MapServer";
  var GROUPS = ["DP02", "DP03", "DP04", "DP05"];
  var NEXT_STOPS = ["Boise, ID", "Savannah, GA", "Duluth, MN", "Santa Fe, NM", "Honolulu, HI", "Asheville, NC", "Laredo, TX", "Bangor, ME", "Tempe, AZ", "Boulder, CO"];

  function safeGet(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  /* ====================================================================
   * Indicators. Each one: how to find it in the Census data, what visual suits it,
   * and the words that describe it. Sentences only describe and compare; they never judge.
   * ==================================================================== */
  var IND = {
    // who lives here
    medAge:  { scene: "people", find: ["sex and age", "median age"], viz: "ruler", grp: "age",
               main: function (c, P) { return "Half of the people in " + P + " are younger than " + K.trimNum(c.p) + " and half are older."; }, usWord: "The U.S. median age" },
    under18: { scene: "people", find: ["sex and age", "under 18 years"], viz: "crowd", grp: "age", subj: "people in {P}", pred: "are under 18" },
    age65:   { scene: "people", find: ["sex and age", "65 years and over"], viz: "crowd", grp: "age", subj: "people in {P}", pred: "are 65 or older" },
    // roots
    mix:     { scene: "roots", custom: "mix", viz: "ruler", grp: "mix",
               main: function (c, P) { return "Pick two residents of " + P + " at random, and there's about a " + Math.round(c.p) + " in 100 chance their racial or ethnic backgrounds differ (Census categories)."; },
               cmp: function (c, P) { var d = c.p - c.pus; return "The U.S. chance is about " + Math.round(c.pus) + " in 100, so " + P + " is " + (Math.abs(d) < 3 ? "close to the national figure" : d > 0 ? "above the national figure" : "below the national figure") + "."; } },
    hisp:    { scene: "roots", find: ["hispanic or latino and race", "hispanic or latino (of any race)"], viz: "crowd", grp: "hisp", subj: "people in {P}", pred: "are Hispanic or Latino, of any race" },
    foreign: { scene: "roots", find: ["place of birth", "foreign born"], viz: "crowd", grp: "foreign", subj: "residents of {P}", pred: "were born outside the United States" },
    lang:    { scene: "roots", find: ["language spoken at home", "language other than english"], viz: "crowd", grp: "lang", subj: "residents of {P} age 5 and over", pred: "speak a language other than English at home" },
    // households
    avgHH:   { scene: "households", find: ["households by type", "average household size"], viz: "ruler", grp: "hhsize",
               main: function (c, P) { return "The average household in " + P + " has " + K.fmt(c, c.p) + " people."; }, usWord: "The U.S. average" },
    alone:   { scene: "households", find: ["householder living alone"], viz: "houses", grp: "alone", subj: "households in {P}", pred: "are one person living alone" },
    kids:    { scene: "households", find: ["households with one or more people under 18"], viz: "houses", grp: "kids", subj: "households in {P}", pred: "include at least one child under 18" },
    married: { scene: "households", find: ["households by type", "married-couple"], viz: "bars", grp: "hhtype", short: "Married-couple households", subj: "households in {P}", pred: "are married couples" },
    hhFemale:{ scene: "households", find: ["households by type", "female householder, no spouse"], viz: "bars", grp: "hhtype", short: "Female householder, no spouse or partner present", subj: "households in {P}", pred: "are family households headed by a woman with no spouse or partner present" },
    hhMale:  { scene: "households", find: ["households by type", "male householder, no spouse"], viz: "bars", grp: "hhtype", short: "Male householder, no spouse or partner present", subj: "households in {P}", pred: "are family households headed by a man with no spouse or partner present" },
    // homes
    own:     { scene: "homes", find: ["housing tenure", "owner-occupied"], viz: "houses", grp: "tenure", subj: "occupied homes in {P}", pred: "are lived in by their owners" },
    value:   { scene: "homes", find: ["value", "median (dollars)"], viz: "tower", grp: "value",
               main: function (c, P) { return "The typical (median) home in " + P + " is valued at " + K.fmt(c, c.p) + "."; } },
    rentVal: { scene: "homes", find: ["gross rent", "median (dollars)"], viz: "tower", grp: "rent",
               main: function (c, P) { return "The typical (median) rent in " + P + " is " + K.fmt(c, c.p) + " a month."; } },
    vacant:  { scene: "homes", find: ["housing occupancy", "vacant housing units"], viz: "houses", grp: "vacant", subj: "homes in {P}", pred: "are vacant" },
    singleFam: { scene: "homes", find: ["units in structure", "1-unit, detached"], viz: "houses", grp: "structure", subj: "homes in {P}", pred: "are detached single-family houses" },
    noCar:   { scene: "homes", find: ["vehicles available", "no vehicles available"], viz: "houses", grp: "cars", subj: "households in {P}", pred: "have no vehicle available" },
    // who owns the homes (Census table S2501)
    ownFM:   { scene: "owners", custom: "fm", viz: "duel", grp: "owners",
               main: function (c, P) {
                 if (c.nW != null && c.nM != null) return "In " + P + ", about " + K.approxCount(c.nW) + " homeowner households are headed by a woman with no spouse present, and about " + K.approxCount(c.nM) + " by a man.";
                 return "Among family households with no spouse present, " + P + " has about " + K.trimNum(c.p) + " owner-households headed by a woman for every 1 headed by a man.";
               },
               cmp: function (c, P) { return "Nationwide the ratio is about " + K.trimNum(c.pus) + " to 1, so the gap in " + P + " is " + (c.sig ? (c.p > c.pus ? "wider" : "narrower") : "about the same") + "."; } },
    ownF:    { scene: "owners", own: "female householder, no spouse", viz: "bars", grp: "ownrate", short: "Households headed by a woman, no spouse present", subj: "households headed by a woman with no spouse present in {P}", pred: "are owned by the people who live there" },
    ownM:    { scene: "owners", own: "male householder, no spouse", viz: "bars", grp: "ownrate", short: "Households headed by a man, no spouse present", subj: "households headed by a man with no spouse present in {P}", pred: "are owned by the people who live there" },
    own1p:   { scene: "owners", own: "1-person household", viz: "bars", grp: "ownrate", short: "One-person households", subj: "one-person households in {P}", pred: "are owned by the person who lives there" },
    ownMC:   { scene: "owners", own: "married-couple family", viz: "bars", grp: "ownrate", short: "Married-couple households", subj: "married-couple households in {P}", pred: "are owned by the couple who lives there" },
    // work and money
    income:  { scene: "work", find: ["median household income"], viz: "tower", grp: "income",
               main: function (c, P) { return "The typical (median) household in " + P + " brings in " + K.fmt(c, c.p) + " a year."; } },
    perCap:  { scene: "work", find: ["per capita income"], viz: "tower", grp: "percap",
               main: function (c, P) { return "Spread across every resident, income in " + P + " works out to " + K.fmt(c, c.p) + " a year per person."; }, usWord: "The U.S. figure" },
    poverty: { scene: "work", find: ["percentage of families and people", "all people"], viz: "crowd", grp: "poverty", subj: "people in {P}", pred: "live below the federal poverty line" },
    commute: { scene: "work", find: ["mean travel time to work"], viz: "ruler", grp: "commute",
               main: function (c, P) { return "The average commute in " + P + " takes about " + Math.round(c.p) + " minutes each way."; }, usWord: "The U.S. average" },
    drive:   { scene: "work", find: ["commuting to work", "drove alone"], viz: "road", grp: "mode", subj: "workers in {P}", pred: "drive to work alone", em: "🚗" },
    wfh:     { scene: "work", find: ["commuting to work", "worked from home"], viz: "road", grp: "mode", subj: "workers in {P}", pred: "work from home", em: "🏠" },
    transit: { scene: "work", find: ["commuting to work", "public transportation"], viz: "road", grp: "mode", subj: "workers in {P}", pred: "take public transportation to work", em: "🚌" },
    walk:    { scene: "work", find: ["commuting to work", "walked"], viz: "road", grp: "mode", subj: "workers in {P}", pred: "walk to work", em: "🚶" },
    // learning: cap and gown
    capAll:  { scene: "learning", custom: "cap", viz: "crowd", grp: "edu", subj: "adults 25 and older in {P}", pred: "have a college degree: an associate's, a bachelor's or a graduate degree" },
    hs:      { scene: "learning", find: ["educational attainment", "high school graduate or higher"], viz: "crowd", grp: "hsdiploma", subj: "adults 25 and older in {P}", pred: "have at least a high school diploma" },
    capAssoc:{ scene: "learning", find: ["educational attainment", "associate's degree"], viz: "stack", grp: "degree", short: "Associate's degree", subj: "adults 25 and older in {P}", pred: "have an associate's degree as their highest level of school" },
    capBach: { scene: "learning", find: ["educational attainment", "bachelor's degree"], not: ["or higher"], viz: "stack", grp: "degree", short: "Bachelor's degree", subj: "adults 25 and older in {P}", pred: "have a bachelor's degree as their highest level of school" },
    capGrad: { scene: "learning", find: ["educational attainment", "graduate or professional degree"], viz: "stack", grp: "degree", short: "Graduate or professional degree", subj: "adults 25 and older in {P}", pred: "have a graduate or professional degree" }
  };

  /* ---------- state ---------- */
  K.approxCount = function (n) {
    n = Math.round(n); if (n < 20) return String(n);
    var mag = Math.pow(10, String(n).length - 2);
    return (Math.round(n / mag) * mag).toLocaleString("en-US");
  };
  var S = { showState: true, st: null, stateName: "", fips: null, items: null, pl: null, us: null, own: null, name: "", R: {}, SAY: {}, facts: [], img: null, geoid: null, loadId: 0, view: null };
  var modules = {};

  /* ====================================================================
   * Data layer (Census API, TIGERweb, Wikipedia)
   * ==================================================================== */
  async function getJSON(url) {
    var ctl = new AbortController(), tm = setTimeout(function () { ctl.abort(); }, 15000), r;
    try { r = await fetch(url, { signal: ctl.signal }); }
    catch (e) { throw new Error(e.name === "AbortError" ? "Timed out waiting for " + url.split("?")[0] : "Couldn't reach " + url.split("?")[0] + " (" + e.message + ")"); }
    finally { clearTimeout(tm); }
    if (!r.ok) { var t = ""; try { t = (await r.text()).slice(0, 160); } catch (e) {} throw new Error("HTTP " + r.status + " from " + url.split("?")[0] + (t ? " - " + t : "")); }
    return r.json();
  }
  async function censusRow(base, group, forClause) {
    var rows = await getJSON(base + "?get=NAME,group(" + group + ")&" + forClause + "&key=" + encodeURIComponent(CFG.CENSUS_KEY));
    var o = {}; rows[0].forEach(function (h, i) { o[h] = rows[1][i]; }); return o;
  }
  async function groupRows(forClause) {
    var parts = await Promise.all(GROUPS.map(function (g) { return censusRow(API, g, forClause); }));
    return Object.assign.apply(null, [{}].concat(parts));
  }
  async function usRows() {
    var ck = "kyc_us_" + CFG.VINTAGE;
    try { var c = sessionStorage.getItem(ck); if (c) return JSON.parse(c); } catch (e) {}
    var rows = await groupRows("for=us:1");
    try { sessionStorage.setItem(ck, JSON.stringify(rows)); } catch (e) {}
    return rows;
  }
  async function labelMap() {
    var ck = "kyc_labels_" + CFG.VINTAGE;
    try { var c = localStorage.getItem(ck); if (c) return JSON.parse(c); } catch (e) {}
    var parts = await Promise.all(GROUPS.map(function (g) { return getJSON(API + "/groups/" + g + ".json"); }));
    var vars = {};
    parts.forEach(function (p) { Object.keys(p.variables).forEach(function (id) { if (/(E|PE)$/.test(id) && !/(EA|PEA)$/.test(id)) vars[id] = { label: p.variables[id].label }; }); });
    try { localStorage.setItem(ck, JSON.stringify(vars)); } catch (e) {}
    return vars;
  }
  async function ownData(forClause, cacheKey) {
    if (cacheKey) { try { var c = sessionStorage.getItem(cacheKey); if (c) return JSON.parse(c); } catch (e) {} }
    var o = await censusRow(SUBJECT, "S2501", forClause);
    if (cacheKey) { try { sessionStorage.setItem(cacheKey, JSON.stringify(o)); } catch (e) {} }
    return o;
  }
  async function ownLabels() {
    var ck = "kyc_own_labels_" + CFG.VINTAGE;
    try { var c = localStorage.getItem(ck); if (c) return JSON.parse(c); } catch (e) {}
    var p = await getJSON(SUBJECT + "/groups/S2501.json"), vars = {};
    Object.keys(p.variables).forEach(function (id) { if (/^S2501_C0[13]_\d{3}E$/.test(id)) vars[id] = { label: p.variables[id].label }; });
    try { localStorage.setItem(ck, JSON.stringify(vars)); } catch (e) {}
    return vars;
  }
  async function loadState(fips) {
    var r = await Promise.all([groupRows("for=state:" + fips), ownData("for=state:" + fips, "kyc_own_st_" + fips).catch(function () { return null; })]);
    S.st = { rows: r[0], ownRow: r[1], fips: fips };
  }
  async function loadOwnership(place, state) {
    try {
      var r = await Promise.all([ownLabels(), ownData("for=us:1", "kyc_own_us_" + CFG.VINTAGE), ownData("for=place:" + place + "&in=state:" + state)]);
      return { rows: K.buildOwnRows(r[0]), us: r[1], pl: r[2] };
    } catch (e) { console.warn("S2501 ownership data unavailable:", e.message); return null; }
  }

  var layerIds = null, layerKinds = {};
  async function placeLayerIds() {
    if (layerIds) return layerIds;
    var j = await getJSON(TIGER + "?f=json");
    var ls = j.layers.filter(function (l) { return /^(incorporated places|census designated places)$/i.test(l.name); });
    ls.forEach(function (l) { layerKinds[l.id] = /census designated/i.test(l.name) ? " (census-designated place)" : ""; });
    layerIds = ls.map(function (l) { return l.id; });
    if (!layerIds.length) throw new Error("Couldn't find Census place layers in TIGERweb");
    return layerIds;
  }
  async function tigerQuery(extra) {
    var ids = await placeLayerIds();
    for (var i = 0; i < ids.length; i++) {
      var j = await getJSON(TIGER + "/" + ids[i] + "/query?" + extra + "&outFields=GEOID,BASENAME,NAME,STATE,PLACE,AREALAND&returnGeometry=true&outSR=4326&maxAllowableOffset=0.0004&f=json");
      if (j.features && j.features.length) return j.features[0];
    }
    return null;
  }
  function lookupByGeoid(g) { return tigerQuery("where=" + encodeURIComponent("GEOID='" + g + "'")); }
  function lookupByPoint(lon, lat) {
    return tigerQuery("geometry=" + encodeURIComponent(lon + "," + lat) + "&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects&where=1%3D1");
  }

  async function geocode(q) {
    if (CFG.ARCGIS_KEY) {
      var j = await getJSON("https://geocode-api.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&maxLocations=8&countryCode=USA&outFields=Addr_type,City,Region,RegionAbbr&singleLine=" + encodeURIComponent(q) + "&token=" + encodeURIComponent(CFG.ARCGIS_KEY));
      if (j.error) throw new Error("ArcGIS: " + (j.error.message || j.error.code));
      var cs = j.candidates || [], towns = cs.filter(function (c) { return c.attributes && /^(Locality|PopulatedPlace)$/i.test(c.attributes.Addr_type || ""); });
      return (towns.length ? towns : cs).map(function (c) { return { name: c.address, lon: c.location.x, lat: c.location.y }; });
    }
    var n = await getJSON("https://nominatim.openstreetmap.org/search?format=json&countrycodes=us&limit=6&q=" + encodeURIComponent(q));
    return n.map(function (r) { return { name: r.display_name, lon: parseFloat(r.lon), lat: parseFloat(r.lat) }; });
  }

  // Free-licensed photos taken near the place, from Wikimedia Commons (no key needed). Keeps real photos only, with credits.
  var PHOTO_SKIP = /\b(map|maps|logo|flag|seal|coat of arms|diagram|locator|plan|chart|poster|scan|sign|signage|plaque|interior|screenshot|banner|icon|diploma|certificate)\b/i;
  var OK_LICENSE = /^(CC[ -]BY(-SA)?( |$)|CC0|Public domain|PD)/i;
  function plainText(html) { var d = document.createElement("div"); d.innerHTML = html || ""; return (d.textContent || "").replace(/\s+/g, " ").trim(); }
  async function commonsPhotos(lat, lon, avoidUrl) {
    var out = [];
    try {
      var j = await getJSON("https://commons.wikimedia.org/w/api.php?action=query&generator=geosearch&ggsnamespace=6&ggscoord=" + lat + "%7C" + lon +
        "&ggsradius=10000&ggslimit=50&prop=imageinfo&iiprop=url%7Cextmetadata%7Cmime%7Csize&iiurlwidth=640&format=json&origin=*");
      var pages = (j.query && j.query.pages) || {};
      Object.keys(pages).map(function (k) { return pages[k]; }).sort(function (a, b) { return (a.index || 0) - (b.index || 0); }).forEach(function (pg) {
        var ii = pg.imageinfo && pg.imageinfo[0]; if (!ii || !ii.extmetadata) return;
        if (ii.mime !== "image/jpeg" || ii.width < 900 || ii.height < 500) return;
        var ratio = ii.width / ii.height; if (ratio < 1.15 || ratio > 2.1) return;
        var m = ii.extmetadata, lic = plainText(m.LicenseShortName && m.LicenseShortName.value);
        if (!OK_LICENSE.test(lic) || /NC|ND/i.test(lic)) return;
        var title = plainText(m.ObjectName && m.ObjectName.value) || pg.title.replace(/^File:/, "").replace(/\.[a-z]+$/i, "").replace(/_/g, " ");
        var desc = plainText(m.ImageDescription && m.ImageDescription.value);
        if (PHOTO_SKIP.test(title) || !K.isNeutralText(title) || !K.isNeutralText(desc)) return;
        if (/^(IMG|DSC|P)[_ -]?\d+/i.test(title) && !desc) return;
        var url = ii.thumburl || ii.url; if (avoidUrl && ii.url === avoidUrl) return;
        var author = plainText(m.Artist && m.Artist.value).slice(0, 48) || "Unknown author";
        out.push({ url: url, title: title.length > 90 ? title.slice(0, 88) + "…" : title, author: author, license: lic, page: ii.descriptionurl });
      });
    } catch (e) { console.warn("Photo search failed:", e.message); }
    return out.slice(0, 5);
  }

  async function wikiFacts(label, lat, lon, base) {
    var out = { sentences: [], nearby: [], img: null, url: null, title: null };
    try {
      var j = await getJSON("https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrlimit=1&gsrsearch=" + encodeURIComponent(label) +
        "&prop=extracts|pageimages|info&inprop=url&exintro=1&explaintext=1&piprop=thumbnail&pithumbsize=500&format=json&origin=*");
      var pages = j.query && j.query.pages, p = pages && pages[Object.keys(pages)[0]];
      if (p && p.title && p.title.toLowerCase().indexOf(base.toLowerCase()) !== -1) {
        out.sentences = K.factSentences(p.extract, 4);
        out.img = p.thumbnail && p.thumbnail.source; out.url = p.fullurl; out.title = p.title;
      }
    } catch (e) {}
    try {
      var g = await getJSON("https://en.wikipedia.org/w/api.php?action=query&generator=geosearch&ggscoord=" + lat + "%7C" + lon +
        "&ggsradius=8000&ggslimit=12&prop=extracts&exintro=1&explaintext=1&exsentences=1&exlimit=max&format=json&origin=*");
      var gp = (g.query && g.query.pages) || {};
      Object.keys(gp).forEach(function (k) {
        var pg = gp[k]; if (!pg.extract || pg.title === out.title) return;
        if (!K.isNeutralText(pg.title)) return;
        var first = K.factSentences(pg.extract, 1)[0] || (pg.extract.length < 200 && K.isNeutralText(pg.extract) ? pg.extract : "");
        if (first) out.nearby.push("Right nearby: " + pg.title + ". " + first);
      });
    } catch (e) {}
    return out;
  }

  /* ====================================================================
   * Visual forms. One per kind of data, so the page doesn't look the same all the way down.
   * ==================================================================== */
  var VIZ = {};
  function vizWrap(id, cls, inner, label) {
    return '<div class="viz vz-' + cls + '" data-hid="' + id + '" role="img" aria-label="' + esc(label) + '">' + inner + '</div>';
  }

  // 100 people, here vs U.S. (vs state)
  function peopleGrid(n, name, cls) {
    var s = '<div class="cg ' + cls + '"><div class="lab"><b>' + esc(name) + '</b>' + n + ' of every 100</div><div class="dots">';
    for (var i = 0; i < 100; i++) s += '<i class="' + (i < n ? "on" : "") + '" style="--i:' + i + '"></i>';
    return s + '</div></div>';
  }
  function hasSt(c) { return S.showState && c.st != null && S.stateName; }
  function n100(v) { return Math.max(v > 0 ? 1 : 0, Math.round(v)); }
  VIZ.crowd = function (r) {
    var c = r.c, st = hasSt(c);
    return vizWrap(r.id, "crowd", '<div class="crowd' + (st ? " three" : "") + '">' + peopleGrid(n100(c.p), S.name, "here") + (st ? peopleGrid(n100(c.st), S.stateName, "st") : "") + peopleGrid(n100(c.pus), "U.S.", "us") + '</div>', r.say.main);
  };

  // rows of 10 houses, each filled by its share
  function houseRow(p, name, cls) {
    var s = '<div class="hrow ' + cls + '"><div class="lab"><b>' + esc(name) + '</b>' + esc(K.fmt({ type: "pct" }, p)) + '</div><div class="hs">';
    for (var i = 0; i < 10; i++) {
      var f = clamp(p / 10 - i, 0, 1);
      s += '<span class="hs1" style="--i:' + i + '"><svg class="bg" viewBox="0 0 40 40"><use href="#i-house"/></svg><svg class="fg" viewBox="0 0 40 40" style="--ff:' + f.toFixed(2) + '"><use href="#i-house"/></svg></span>';
    }
    return s + '</div></div>';
  }
  VIZ.houses = function (r) {
    var c = r.c;
    return vizWrap(r.id, "houses", '<div class="hrows">' + houseRow(c.p, S.name, "here") + (hasSt(c) ? houseRow(c.st, S.stateName, "st") : "") + houseRow(c.pus, "U.S.", "us") + '</div>', r.say.main);
  };

  // dollars as buildings
  VIZ.tower = function (r) {
    var c = r.c, st = hasSt(c), max = Math.max(c.p, c.pus, st ? c.st : 0) || 1;
    var col = function (v, name, cls) { return '<div class="tcol ' + cls + '" style="--h:' + Math.max(6, v / max * 82) + '%"><div class="v">' + esc(K.fmt(c, v)) + '</div><div class="b"></div><div class="n">' + esc(name) + '</div></div>'; };
    return vizWrap(r.id, "tower", '<div class="tower' + (st ? " three" : "") + '">' + col(c.p, S.name, "here") + (st ? col(c.st, S.stateName, "st") : "") + col(c.pus, "U.S.", "us") + '</div>', r.say.main);
  };

  // a scale with pins
  VIZ.ruler = function (r) {
    var c = r.c, st = hasSt(c), max = Math.max(c.p, c.pus, st ? c.st : 0) * 1.4, pos = function (v) { return clamp(v / max * 100, 6, 94); };
    var pins = [{ cls: "here", v: c.p, n: S.name, lane: "t" }, { cls: "us", v: c.pus, n: "U.S.", lane: "b" }];
    if (st) { var dt = Math.abs(pos(c.st) - pos(c.p)), db = Math.abs(pos(c.st) - pos(c.pus)); pins.push({ cls: "st", v: c.st, n: S.stateName, lane: dt > db ? "t" : "b" }); }
    ["t", "b"].forEach(function (l) {
      var ps = pins.filter(function (p) { return p.lane === l; }).sort(function (a, b) { return pos(a.v) - pos(b.v); });
      if (ps.length === 2 && pos(ps[1].v) - pos(ps[0].v) < 16) { ps[0].sh = -46; ps[1].sh = 46; }
    });
    var inner = '<div class="ruler" style="--w:' + pos(c.p) + '%"><div class="line"></div><div class="fill"></div>' +
      pins.map(function (p) { return '<div class="pin ' + (p.lane === "t" ? "top" : "bot") + ' ' + p.cls + '" style="left:' + pos(p.v) + '%"><span class="lbl" style="--sh:' + (p.sh || 0) + 'px"><b>' + esc(K.fmt(c, p.v)) + '</b>' + esc(p.n) + '</span><i></i></div>'; }).join("") + '</div>';
    return vizWrap(r.id, "ruler", inner, r.say.main);
  };

  // a ring with a tick for the U.S. (and a dashed tick for the state)
  VIZ.ring = function (r) {
    var c = r.c, p = clamp(c.p, 0, 100), st = hasSt(c);
    function tick(v, cls) {
      var a = clamp(v, 0, 100) / 100 * 2 * Math.PI;
      return '<line class="' + cls + '" x1="' + (60 + 46 * Math.cos(a)).toFixed(1) + '" y1="' + (60 + 46 * Math.sin(a)).toFixed(1) + '" x2="' + (60 + 66 * Math.cos(a)).toFixed(1) + '" y2="' + (60 + 66 * Math.sin(a)).toFixed(1) + '"/>';
    }
    var cap = 'Solid tick: U.S. figure, ' + K.fmt(c, c.pus) + (st ? '. Dashed tick: ' + S.stateName + ', ' + K.fmt(c, c.st) : '');
    var inner = '<div class="ringwrap"><div class="ring"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="52" pathLength="100"/>' +
      '<circle class="ar" cx="60" cy="60" r="52" pathLength="100" style="--p:' + p.toFixed(1) + '"/>' + tick(c.pus, "tk") + (st ? tick(c.st, "tk2") : "") + '</svg>' +
      '<div class="mid">' + esc(K.fmt(c, c.p)) + '</div></div><div class="ring-cap">' + esc(cap) + '</div></div>';
    return vizWrap(r.id, "ring", inner, r.say.main);
  };

  // Women-led vs men-led homeowners: real counts as rows of houses, then the ratio next to the U.S. and state
  function niceUnit(max) {
    var steps = [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000, 10000, 20000, 50000, 100000, 200000];
    for (var i = 0; i < steps.length; i++) if (max / steps[i] <= 24) return steps[i];
    return 500000;
  }
  function houseIcons(n, unit, cls) {
    var k = n / unit, full = Math.floor(k), s = '<div class="dh ' + cls + '">';
    for (var i = 0; i < Math.ceil(k - 1e-9); i++) s += '<span class="hs1" style="--i:' + i + '"><svg class="bg" viewBox="0 0 40 40"><use href="#i-house"/></svg><svg class="fg" viewBox="0 0 40 40" style="--ff:' + (i < full ? 1 : (k - full).toFixed(2)) + '"><use href="#i-house"/></svg></span>';
    return s + '</div>';
  }
  VIZ.duel = function (r) {
    var c = r.c;
    if (c.nW == null || c.nM == null) return VIZ.blocks(r);
    var unit = niceUnit(Math.max(c.nW, c.nM)), st = hasSt(c), SN = S.stateName;
    var norm = function (ratio, name, cls) { return { v: ratio * 100, name: name, cls: cls }; };
    var rows = [norm(c.p, S.name, "here")]; if (st) rows.push(norm(c.st, SN, "st")); rows.push(norm(c.pus, "U.S.", "us"));
    var max = Math.max.apply(null, rows.map(function (x) { return x.v; })) * 1.12, ref = 100 / max * 100;
    var strip = rows.map(function (x) {
      return '<div class="nr ' + x.cls + '"><span class="nl">' + esc(x.name) + '</span><div class="nb"><div class="nf" style="--w:' + (x.v / max * 100).toFixed(1) + '%"><b>' + Math.round(x.v) + '</b></div></div></div>';
    }).join("");
    var inner = '<div class="duelbox">' +
      '<div class="dgrp"><div class="dnum">' + esc(K.approxCount(c.nW)) + '</div><div class="dlab">homeowner households headed by a woman, no spouse present</div>' + houseIcons(c.nW, unit, "w") + '</div>' +
      '<div class="dgrp"><div class="dnum">' + esc(K.approxCount(c.nM)) + '</div><div class="dlab">homeowner households headed by a man, no spouse present</div>' + houseIcons(c.nM, unit, "m") + '</div>' +
      '<p class="dunit">Each house stands for ' + unit.toLocaleString("en-US") + ' households.</p>' +
      '<div class="norm"><p class="nt">For every 100 homeowner households headed by a man with no spouse present, how many are headed by a woman?</p>' + strip +
      '<div class="refline" style="left:calc(var(--lw) + ' + ref.toFixed(1) + '% * var(--bw))"></div></div></div>';
    return vizWrap(r.id, "duel", inner, r.say.main);
  };

  // ratio as stacks of houses
  VIZ.blocks = function (r) {
    var c = r.c;
    var row = function (ratio, name, cls) {
      var n = clamp(Math.round(ratio), 1, 9), s = '<div class="brow ' + cls + '"><div class="lab">' + esc(name) + ': ' + esc(K.trimNum(ratio)) + ' to 1</div><div class="bh">';
      for (var i = 0; i < n; i++) s += '<svg class="A" viewBox="0 0 40 40" style="--i:' + i + '"><use href="#i-house"/></svg>';
      s += '<svg class="B" viewBox="0 0 40 40" style="--i:' + n + '"><use href="#i-house"/></svg></div></div>';
      return s;
    };
    var inner = '<div class="blocks">' + row(c.p, S.name, "here") + (hasSt(c) ? row(c.st, S.stateName, "st") : "") + row(c.pus, "U.S.", "us") +
      '<div class="key"><span>Owned by a woman, no spouse present</span><span class="b">Owned by a man, no spouse present</span></div></div>';
    return vizWrap(r.id, "blocks", inner, r.say.main);
  };

  /* ---------- beats ---------- */
  function sayHTML(say) { return '<p class="main">' + esc(say.main) + '</p><p class="cmp">' + esc(say.cmp) + '</p>'; }
  function beat(id, flip, twist) {
    var r = S.R[id]; if (!r || !VIZ[r.spec.viz]) return null;
    var d = el("div", "beat" + (flip ? " flip" : "") + (twist ? " twist" : ""));
    d.innerHTML = '<div class="txt">' + sayHTML(r.say) + '</div>' + VIZ[r.spec.viz](r);
    S.SAY[id] = r.say.main;
    return d;
  }
  var SC = {
    yellow: { bg: "#FFD23F", acc: "#1E1B4B" }, mint: { bg: "#8FE3C8", acc: "#0B6E55" }, lilac: { bg: "#C9B8FF", acc: "#4B2FBF" },
    tang: { bg: "#FFB35C", acc: "#B5400A" }, pink: { bg: "#FFB8D2", acc: "#A31858" }, leaf: { bg: "#B6E36B", acc: "#2D6A1E" }, teal: { bg: "#6FD6CB", acc: "#0A5560" }
  };
  function scene(key, sign) {
    var c = SC[key], s = el("section", "scene");
    s.style.setProperty("--bg", c.bg); s.style.setProperty("--acc", c.acc);
    if (sign) s.appendChild(el("div", "sign", esc(sign)));
    return s;
  }
  // How far this place sits from the U.S. figure, in statistical terms (bigger = more different).
  function rank(r) { return r.spec.custom === "mix" ? r.c.rel * 20 : Math.abs(r.c.z || 0); }
  function byRank(a, b) { return rank(b) - rank(a); }

  // Degrees as stacked bars: place, state, U.S.; one sentence per kind of degree
  function stackBlock(ids) {
    var rs = ids.map(function (i) { return S.R[i]; }).filter(Boolean); if (rs.length < 2) return null;
    var useSt = rs.every(function (r) { return hasSt(r.c); });
    var rows = [{ n: S.name, k: "p", cls: "here" }];
    if (useSt) rows.push({ n: S.stateName, k: "st", cls: "st" });
    rows.push({ n: "U.S.", k: "pus", cls: "us" });
    var totals = rows.map(function (row) { return rs.reduce(function (a, r) { return a + (r.c[row.k] || 0); }, 0); });
    var max = Math.max.apply(null, totals) * 1.08 || 1;
    var bars = rows.map(function (row, ri) {
      var segs = rs.map(function (r, si) {
        var v = r.c[row.k] || 0;
        return '<span class="sg s' + si + '" style="--w:' + (v / max * 100).toFixed(2) + '%" title="' + esc(r.spec.short) + '">' + (v >= 4 ? '<b>' + Math.round(v) + '%</b>' : '') + '</span>';
      }).join("");
      return '<div class="srow ' + row.cls + '"><div class="sn">' + esc(row.n) + '</div><div class="sbar">' + segs + '</div><div class="stot">' + Math.round(totals[ri]) + '%</div></div>';
    }).join("");
    var sorted = rs.slice().sort(byRank);
    var sents = sorted.map(function (r) {
      S.SAY[r.id] = r.say.main;
      return '<div class="srow2" data-hid="' + r.id + '"><span class="sw s' + rs.indexOf(r) + '"></span><div><p class="main">' + esc(r.say.main) + '</p><p class="cmp">' + esc(r.say.cmp) + '</p></div></div>';
    }).join("");
    var d = el("div", "bars stackb");
    d.innerHTML = '<h3>Which degrees are they?</h3><div class="stack">' + bars + '</div>' +
      '<div class="skey">' + rs.map(function (r, i) { return '<span><i class="sw s' + i + '"></i>' + esc(r.spec.short) + '</span>'; }).join("") + '</div>' +
      '<div class="srows2">' + sents + '</div>';
    return d;
  }

  // Horizontal bars with the U.S. (and state) as tick marks; one sentence per bar
  function barsBlock(title, ids) {
    var rs = ids.map(function (i) { return S.R[i]; }).filter(Boolean).sort(byRank); if (!rs.length) return null;
    var anySt = rs.some(function (r) { return hasSt(r.c); });
    var max = Math.max.apply(null, rs.map(function (r) { return Math.max(r.c.p, r.c.pus, hasSt(r.c) ? r.c.st : 0); })) * 1.12 || 1;
    var rows = rs.map(function (r) {
      var c = r.c, w = c.p / max * 100; S.SAY[r.id] = r.say.main;
      return '<div class="brow2" data-hid="' + r.id + '"><p class="main">' + esc(r.say.main) + '</p>' +
        '<div class="lab">' + esc(r.spec.short || "") + '</div>' +
        '<div class="bar"><div class="f' + (w < 16 ? " sh" : "") + '" style="--w:' + w.toFixed(1) + '%"><b>' + esc(K.fmt(c, c.p)) + '</b></div>' +
        '<i class="t us" style="left:' + (c.pus / max * 100).toFixed(1) + '%"></i>' + (hasSt(c) ? '<i class="t st" style="left:' + (c.st / max * 100).toFixed(1) + '%"></i>' : '') + '</div>' +
        '<p class="cmp">' + esc(r.say.cmp) + '</p></div>';
    }).join("");
    var d = el("div", "bars");
    d.innerHTML = '<h3>' + esc(title) + '</h3><div class="bar-rows">' + rows + '</div><p class="legend2">' + (anySt ? '<span class="k st"></span>' + esc(S.stateName) + ' figure' : '') + '<span class="k us"></span>U.S. figure</p>';
    return d;
  }

  // Commute modes as one road, with a sentence per lane (most different lane first)
  function roadBlock(ids) {
    var rs = ids.map(function (i) { return S.R[i]; }).filter(Boolean).sort(byRank); if (!rs.length) return null;
    var tot = rs.reduce(function (a, r) { return a + r.c.p; }, 0) || 1;
    var d = el("div", "composite");
    var segs = rs.map(function (r) { return '<span style="--w:' + (r.c.p / tot * 100).toFixed(1) + '%" title="' + esc(r.spec.pred) + '">' + r.spec.em + '</span>'; }).join("");
    var rows = rs.map(function (r) {
      S.SAY[r.id] = r.say.main;
      return '<div class="rrow" data-hid="' + r.id + '"><div class="em">' + r.spec.em + '</div><div><p class="main">' + esc(r.say.main) + '</p><p class="cmp">' + esc(r.say.cmp) + '</p></div></div>';
    }).join("");

  }

  // Education as stairs, with a sentence per step (kept in step order so it reads as a staircase)
  function stairsBlock(ids) {
    var rs = ids.map(function (i) { return S.R[i]; }).filter(Boolean); if (!rs.length) return null;
    var d = el("div", "composite"), anySt = false;
    var steps = rs.map(function (r) {

    var out = [].concat.apply([], lists), qlow = name.toLowerCase();
    out.sort(function (a, b) {
      var ea = a.base.toLowerCase() === qlow ? 0 : 1, eb = b.base.toLowerCase() === qlow ? 0 : 1;
      return ea - eb || a.base.localeCompare(b.base) || (STATES[a.state] ? STATES[a.state][0] : "").localeCompare(STATES[b.state] ? STATES[b.state][0] : "");
    });
    return out.slice(0, 8).map(function (r) { var st = STATES[r.state]; return { geoid: r.geoid, name: r.base + (st ? ", " + st[0] : "") + r.kind }; });
  }

  var suggTimer = null, suggData = [], suggActive = -1, suggSeq = 0, sugg = $("#sugg");
  function renderSugg(items, msg, input) {
    sugg.innerHTML = ""; suggActive = -1;
    if (!items.length) { sugg.appendChild(el("li", null, esc(msg))).style.cursor = "default"; }
    items.forEach(function (s, i) { var li = el("li", null, esc(s.name)); li.setAttribute("role", "option"); li.onclick = function () { pick(i, input); }; sugg.appendChild(li); });
    if (input.id === "q2") { var r = input.getBoundingClientRect(); sugg.style.position = "fixed"; sugg.style.left = r.left + "px"; sugg.style.top = (r.bottom + 6) + "px"; sugg.style.width = r.width + "px"; sugg.style.right = "auto"; }
    else { sugg.style.position = ""; sugg.style.left = ""; sugg.style.top = ""; sugg.style.width = ""; sugg.style.right = ""; }
    sugg.style.display = "block";
  }
  function markActive() { $$("li", sugg).forEach(function (li, i) { li.style.background = i === suggActive ? "#FFE98F" : ""; }); }
  function wireSearch(input) {
    input.addEventListener("input", function () {
      clearTimeout(suggTimer);
      var v = input.value.trim();
      if (v.length < 2) { sugg.style.display = "none"; return; }
      var seq = ++suggSeq;
      renderSugg([], "Searching…", input);
      suggTimer = setTimeout(function () {
        var errs = [], tigerShown = false;
        function withTimeout(pr, ms, label) { return Promise.race([pr, new Promise(function (_, rej) { setTimeout(function () { rej(new Error(label + " took too long")); }, ms); })]); }
        function show(res) { suggData = res; renderSugg(res, "", input); }
        var tigerP = withTimeout(searchPlaces(v), 12000, "Census place search").catch(function (e) { errs.push(e.message); console.warn("Place search failed:", e); return []; });
        var geoP = withTimeout(geocode(v), 9000, "Geocoder").then(function (g) { return g.map(function (x) { return { lon: x.lon, lat: x.lat, name: x.name }; }); }).catch(function (e) { errs.push(e.message); console.warn("Geocoder failed:", e); return []; });
        tigerP.then(function (r) { if (seq === suggSeq && r.length) { tigerShown = true; show(r); } });
        geoP.then(function (r) { if (seq === suggSeq && !tigerShown && r.length) show(r); });
        Promise.all([tigerP, geoP]).then(function (all) {
          if (seq !== suggSeq || all[0].length || all[1].length) return;
          suggData = [];
          renderSugg([], errs.length ? "Search isn't working right now (" + errs[0] + ")." : "No Census places match that. Try the city name, then a comma and the state.", input);
        });
      }, 250);
    });
    input.addEventListener("keydown", function (e) {
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        if (!suggData.length || sugg.style.display === "none") return;
        e.preventDefault(); suggActive = (suggActive + (e.key === "ArrowDown" ? 1 : -1) + suggData.length) % suggData.length; markActive();
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (suggData.length && sugg.style.display !== "none") pick(suggActive > -1 ? suggActive : 0, input);
      } else if (e.key === "Escape") sugg.style.display = "none";
    });
  }
  document.addEventListener("click", function (e) { if (!e.target.closest(".search") && !e.target.closest("#sugg") && !e.target.closest("#q2")) sugg.style.display = "none"; });
  async function pick(i, input) {
    var s = suggData[i]; if (!s) return;
    sugg.style.display = "none"; input.value = "";
    if (s.geoid) await selectByGeoid(s.geoid); else selectByPoint(s.lon, s.lat);
  }
  async function goTo(name) {
    try {
      var r = await searchPlaces(name);
      if (r.length) return selectByGeoid(r[0].geoid);
      var g = await geocode(name); if (g.length) selectByPoint(g[0].lon, g[0].lat);
    } catch (e) { showError("Couldn't search for " + name + ". " + e.message); }
  }
  async function selectByGeoid(geoid) {
    try {
      var f = await lookupByGeoid(geoid);
      if (!f) { showBubble("Hmm, I couldn't find that place's boundary."); return; }
      window.scrollTo({ top: 0 });
      loadPlace(f);
    } catch (e) { showError("Couldn't look up that place. " + e.message); }
  }
  async function selectByPoint(lon, lat) {
    try {
      var f = await lookupByPoint(lon, lat);
      if (!f) { showBubble("Hmm, that spot isn't inside a Census Place. Try a city, town or village."); return; }
      window.scrollTo({ top: 0 });
      loadPlace(f);
    } catch (e) { showError("Couldn't look up that place. " + e.message); }
  }
  wireSearch($("#q"));

  function showError(msg) {
    $("#loading").classList.add("gone");
    var story = $("#story"); story.innerHTML = "";
    var d = el("section", "scene"); d.style.setProperty("--bg", "#FFD23F");
    d.innerHTML = '<div class="err"><h2>The numbers didn\'t load.</h2><p>' + esc(msg) + '</p><p>If this mentions a Census key, check that it has been activated from the email link, then reload.</p></div>';
    story.appendChild(d);
  }

  /* ====================================================================
   * Load a place
   * ==================================================================== */
  function drawPlace(poly) {
    if (!S.view || !poly) return;
    S.view.graphics.removeAll();
    S.view.graphics.add(new modules.Graphic({ geometry: poly, symbol: { type: "simple-fill", color: [30, 27, 75, 0.18], outline: { color: [30, 27, 75, 1], width: 3 } } }));
    S.view.goTo(poly.extent.expand(1.3), { duration: 900 }).catch(function () {});
  }
  // Web map: filter its Census Places layer to this place. Otherwise: outline the place from TIGERweb.
  async function applyPlaceToMap() {
    var v = S.view, a = S.curAttrs; if (!v || !a) return;
    if (S.webmap) {
      var layers = [];
      try {
        await v.when();
        layers = v.map.allLayers.filter(function (l) { return l.type === "feature" && (!WEBMAP.layerTitles || !WEBMAP.layerTitles.length || WEBMAP.layerTitles.indexOf(l.title) > -1); }).toArray();
        if (!layers.length) throw new Error("no Census place layers found in the web map");
        layers.forEach(function (l) { l.visible = false; });
        var expr = (WEBMAP.expression || "GEOID = '{GEOID}'").replace(/\{(GEOID|STATE|PLACE|NAME)\}/g, function (m, k) { return String(a[k] == null ? "" : a[k]).replace(/'/g, "''"); });
        var found = null;
        for (var i = 0; i < layers.length; i++) {
          await layers[i].load();
          // Respect the popups configured in the web map. A template with a title and no content should show only the title
          // (the SDK would otherwise fill in a table of every field). Any other kind of content you add is kept.
          var tpl = layers[i].popupTemplate;
          if (tpl) {
            var pc = tpl.content, keepc = pc;
            if (Array.isArray(pc)) keepc = pc.filter(function (e) { return !(e && e.type === "fields"); });
            if (pc == null || pc === "" || (Array.isArray(keepc) && !keepc.length)) keepc = function () { var d = document.createElement("span"); d.style.display = "none"; return d; };
            if (keepc !== pc) tpl.content = keepc;
          }
          layers[i].definitionExpression = expr;
          if (found) continue;
          var q = await layers[i].queryExtent();
          if (q && q.count > 0 && q.extent) { found = { layer: layers[i], extent: q.extent }; }
        }
        if (found) { found.layer.visible = true; v.graphics.removeAll(); await v.goTo(found.extent.expand(1.4), { duration: 900 }); return; }
        console.info("None of the web map's layers has a feature for " + a.GEOID + "; showing the Census boundary instead.");
      } catch (e) { layers.forEach(function (l) { try { l.visible = false; } catch (e2) {} }); console.warn("Web map filter failed (" + e.message + "). Showing the place outline only."); }
    }
    drawPlace(S.pendingPoly);
  }

  async function loadPlace(feature) {
    var myLoad = ++S.loadId, a = feature.attributes;
    S.geoid = a.GEOID; S.st = null; S.fips = a.STATE; S.own = null; S.facts = []; S.photos = []; S.img = null; S.wikiUrl = null;
    history.replaceState(null, "", "?place=" + a.GEOID);
    $("#loading").classList.remove("gone");
    $("#placeName").textContent = a.BASENAME || a.NAME;
    $("#stateName").innerHTML = "&nbsp;";
    S.name = a.BASENAME || a.NAME;

    var rg = feature.geometry.rings, poly = Poly(rg), wikiP = null, photoP = null;
    S.pendingPoly = poly; S.curAttrs = a; applyPlaceToMap();
    var xs = [], ys = []; rg.forEach(function (r) { r.forEach(function (c) { xs.push(c[0]); ys.push(c[1]); }); });
    var center = { longitude: (Math.min.apply(null, xs) + Math.max.apply(null, xs)) / 2, latitude: (Math.min.apply(null, ys) + Math.max.apply(null, ys)) / 2 };

    if (!CFG.CENSUS_KEY) { showError("This app needs a free Census API key. Paste it into HARDCODED.census at the top of the script in index.html."); return; }
    try {
      var res = await Promise.all([labelMap(), usRows(), groupRows("for=place:" + a.PLACE + "&in=state:" + a.STATE), loadOwnership(a.PLACE, a.STATE), loadState(a.STATE).catch(function (e) { console.warn("State comparison unavailable:", e.message); })]);
      if (myLoad !== S.loadId) return;
      S.items = K.buildItems(res[0]); S.us = res[1]; S.pl = res[2]; S.own = res[3];
      var nm = K.splitCensusName(S.pl.NAME);
      $("#stateName").textContent = nm.state;
      S.name = a.BASENAME || nm.place; S.stateName = nm.state;
      $("#placeName").textContent = S.name;

      wikiP = wikiFacts(S.name + ", " + nm.state, center.latitude, center.longitude, S.name); photoP = commonsPhotos(center.latitude, center.longitude);
    } catch (e) { console.error(e); showError(e.message); return; }

    var w = await wikiP;
    S.photos = (await photoP) || [];
    if (myLoad !== S.loadId) return;
    S.img = w.img; S.wikiUrl = w.url;
    var facts = w.sentences.concat(w.nearby.sort(function () { return Math.random() - 0.5; }).slice(0, 3));
    try {
      var pop = K.findItem(S.items, ["sex and age", "total population"]), popV = pop && K.getVals(S.pl, pop.base).e;
      if (popV && a.AREALAND) { var sqmi = a.AREALAND / 2589988.11; if (sqmi > 0.2) facts.push("About " + Math.round(popV / sqmi).toLocaleString() + " people live per square mile here, across roughly " + sqmi.toFixed(1) + " square miles of land."); }
    } catch (e) {}
    S.facts = facts;
    buildStory();
    $("#loading").classList.add("gone");
    setTimeout(function () { sched(); }, 200);
  }

  /* ---------- Boot ---------- */
  function startMap() {
    if (typeof require === "undefined") { console.warn("ArcGIS Maps SDK did not load; continuing without the map."); return; }
    try {
      require(["esri/config", "esri/Map", "esri/WebMap", "esri/views/MapView", "esri/Graphic", "esri/geometry/Polygon", "esri/layers/WebTileLayer", "esri/core/reactiveUtils"],
        function (esriConfig, Map, WebMap, MapView, Graphic, Polygon, WebTileLayer, reactiveUtils) {
          modules.Graphic = Graphic; modules.Polygon = Polygon;
          var wmId = WEBMAP.id || qs.get("webmap") || "", map;
          if (CFG.ARCGIS_KEY) esriConfig.apiKey = CFG.ARCGIS_KEY;
          if (wmId) { map = new WebMap({ portalItem: { id: wmId } }); S.webmap = true; }
          else if (CFG.ARCGIS_KEY) map = new Map({ basemap: "arcgis/community" });
          else map = new Map({ layers: [new WebTileLayer({ urlTemplate: "https://{subDomain}.tile.openstreetmap.org/{level}/{col}/{row}.png", subDomains: ["a", "b", "c"], copyright: "© OpenStreetMap contributors" })] });
          S.view = new MapView({ container: "viewDiv", map: map, center: [-117.18, 34.06], zoom: 11, ui: { components: ["zoom"] },
            popup: { collapseEnabled: true, dockEnabled: true, dockOptions: { buttonEnabled: false, breakpoint: false, position: "bottom-center" } },
            navigation: { mouseWheelZoomEnabled: false, browserTouchPanEnabled: true } });
          // The page scrolls by default. Click the map to zoom with the scroll wheel; moving away gives scrolling back.
          var box = $("#viewDiv"), hint = $("#maphint");
          S.view.on("click", function () { S.view.navigation.mouseWheelZoomEnabled = true; if (hint) hint.classList.add("gone"); });
          box.addEventListener("mouseleave", function () { S.view.navigation.mouseWheelZoomEnabled = false; });
          // Popups open collapsed, as a neat title bar along the bottom of the house. Click the arrow to expand.
          try { reactiveUtils.watch(function () { return S.view.popup.visible; }, function (vis) { if (vis) S.view.popup.collapsed = true; }); } catch (e) { console.warn("Popup collapse unavailable:", e); }
          S.view.when(function () { applyPlaceToMap(); }, function (e) { console.warn("Map view failed:", e); });
        }, function (err) { console.warn("Map failed to start:", err); });
    } catch (e) { console.warn("Map failed to start:", e); }
  }
  function Poly(rings) { return modules.Polygon ? new modules.Polygon({ rings: rings, spatialReference: { wkid: 4326 } }) : null; }

  window.addEventListener("error", function (e) { if ($("#loading") && !$("#loading").classList.contains("gone")) showError("Something went wrong: " + e.message); });
  window.addEventListener("unhandledrejection", function (e) { if (!$("#loading").classList.contains("gone")) showError("Something went wrong: " + ((e.reason && e.reason.message) || e.reason)); });

  async function checkArcgisKey() {
    if (!CFG.ARCGIS_KEY) return;
    try {
      var j = await getJSON("https://geocode-api.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates?f=json&maxLocations=1&singleLine=Redlands&token=" + encodeURIComponent(CFG.ARCGIS_KEY));
      if (j.error) throw new Error(j.error.message || ("code " + j.error.code));
    } catch (e) {
      console.warn("The ArcGIS key was not accepted (" + e.message + "). Using OpenStreetMap instead. In the key's settings, add " + location.origin + " as a referrer URL.");
      CFG.ARCGIS_KEY = ""; S.keyIssue = true;
    }
  }
  checkArcgisKey().then(startMap, startMap);
  (async function () {
    var wd = setTimeout(function () { if (!$("#loading").classList.contains("gone")) showError("This is taking too long. Check your internet connection and reload."); }, 40000);
    try {
      var geoid = (qs.get("place") || CFG.DEFAULT_GEOID).replace(/\D/g, "");
      var f = await lookupByGeoid(geoid) || await lookupByGeoid(CFG.DEFAULT_GEOID);
      if (!f) throw new Error("Couldn't load the place boundary from Census TIGERweb.");
      await loadPlace(f);
    } catch (e) { console.error(e); showError(e.message); }
    clearTimeout(wd);
  })();
})();
</script>
